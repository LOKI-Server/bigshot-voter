[package]
name = "bigshot-voter"
version = "0.2.0"
edition = "2024"
description = "Big-Shot Voting — simple self-hosted voting panels"
license = "MIT"
readme = "README.md"

[dependencies]
# Web stack — keep features minimal for compile time + binary size
axum = { version = "0.8", default-features = false, features = [
    "http1",
    "tokio",
    "query",
    "form",
    "multipart",
    "original-uri",
    "matched-path",
    "tower-log",
    "tracing",
] }
axum-extra = { version = "0.10", default-features = false, features = ["cookie", "form"] }
tokio = { version = "1", default-features = false, features = [
    "rt-multi-thread",
    "macros",
    "net",
    "fs",
    "io-util",
    "sync",
    "time",
    "signal",
] }
tower = { version = "0.5", default-features = false, features = ["util"] }
tower-http = { version = "0.6", default-features = false, features = [
    "fs",
    "set-header",
    "trace",
    "util",
] }
# sqlx without chrono/macros — we store datetimes as TEXT
sqlx = { version = "0.8", default-features = false, features = [
    "runtime-tokio",
    "sqlite",
] }
argon2 = { version = "0.5", default-features = false, features = [
    "alloc",
    "password-hash",
    "rand",
] }
rand = { version = "0.8", default-features = false, features = ["std", "std_rng"] }
uuid = { version = "1", default-features = false, features = ["v4", "std"] }
serde = { version = "1", default-features = false, features = ["derive", "std"] }
tracing = { version = "0.1", default-features = false }
tracing-subscriber = { version = "0.3", default-features = false, features = [
    "env-filter",
    "fmt",
    "std",
    "ansi",
] }
thiserror = "2"
anyhow = "1"
hmac = { version = "0.12", default-features = false }
sha2 = { version = "0.10", default-features = false }
base64 = { version = "0.22", default-features = false, features = ["std"] }
urlencoding = "2"
clap = { version = "4", default-features = false, features = [
    "std",
    "derive",
    "env",
    "help",
    "usage",
    "error-context",
] }
askama = { version = "0.12", default-features = false }
# Markdown for panel descriptions. Raw HTML passthrough is filtered out in
# src/markdown.rs, so no HTML sanitizer is needed on top.
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
# Exact Content-Type for uploaded media handed to tower-http's ServeFile.
mime = { version = "0.3", default-features = false }
time = { version = "0.3", default-features = false, features = ["std", "formatting"] }
serde_json = { version = "1.0.151", features = ["std"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }

# --- Profiles ----------------------------------------------------------------

[profile.dev]
# Faster link + smaller target dir; enough for backtraces in practice
debug = "line-tables-only"

[profile.dev.package."*"]
# Optimize dependencies in dev so tests/server feel snappy without bloating
# our own incremental rebuilds as much as a global opt-level would.
opt-level = 2

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"

# Maximum size reduction when you care more about MiB than microbenchmarks:
#   cargo build --profile release-size
[profile.release-size]
inherits = "release"
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
