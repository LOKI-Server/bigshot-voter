[package]
name = "bigshot-voter"
version = "0.5.0"
edition = "2024"
license = "MIT"
description = "Voting panels for LOKI"
readme = "README.md"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
loki-sdk = { version = "0.1.0", path = "../LOKI/crates/loki-sdk", features = ["templates"] }
askama = { version = "0.12", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
time = { version = "0.3", features = ["formatting"] }

[dev-dependencies]
loki-sdk = { version = "0.1.0", path = "../LOKI/crates/loki-sdk", features = ["templates", "testing"] }

[package.metadata.loki]
id = "bigshot-voter"
name = "Bigshot Voter"
health = "/health"
roles = ["admin"]
capabilities = ["database", "uploads", "forms"]
assets = ["static"]

[package.metadata.loki.limits]
memory_mib = 32
fuel = 50000000
timeout_seconds = 30
concurrent_requests = 4
request_bytes = 16777216

[[package.metadata.loki.fields]]
key = "max-upload"
label = "Maximum upload size (bytes)"
kind = "number"
required = true
default = 5242880

[profile.dev]
debug = "line-tables-only"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
